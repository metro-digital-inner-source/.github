#
# SonarQube Static Code Analysis
#
# Minimal SonarQube workflow template for static code analysis.
# Customize as needed for your project requirements.
#
# Prerequisites:
# 1. Create a SonarQube project and obtain the {{PROJECT_KEY}}.
#    - if you onboard from SonarQube via GitHub integration, the project key will
#      be automatically generated in the format of {{GITHUB_ORG}}_{{REPO_NAME}}_{{UUID}}
#    - if you generate via local project creation, use at least {{GITHUB_ORG}}_{{REPO_NAME}}
#    - you can also update the key in SonarQube and remove the {{UUID}} suffix
# 2. In SonarQube Navigate and check the tutorials for GitHub Actions at
#    https://{{SONAR_HOST_URL}}/tutorials?id={{PROJECT_KEY}}&selectedTutorial=github-actions
#    and follow the instructions that best fit your project, Do not overwrite this file,
#    instead, add extra steps as needed.
#
# Notes:
#   - For GitHub PR decoration, ensure DevOps Platform Integration is configured in SonarQube
#     and the project is linked to this GitHub repository.
#     Go to Project Settings > General Settings > DevOps Platform Integration
#     and make sure the required configuration values are set.
#   - If you do not want SonarQube to run on all PR events, use a label-based condition
#     (for example, only run when the PR has the `sonarqube-scan` label).
#     You can implement this by using the actions/labeler workflow.
#
# Contact:  Channel: SonarQube @ Deployment Tools in Microsoft Teams

name: SonarQube Scan

on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/**
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube scan
    runs-on:
      - self-hosted
      - Linux
      - metro-network
    env:
      SONAR_HOST_URL: https://sonarqube.metrosystems.net
      # SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      SONAR_PROJECT_KEY: __REPLACE_WITH_SONAR_PROJECT_KEY__
      SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # We do not recommend to use this in a pull request. Prefer using pull request
      # decoration instead.
      # - uses: SonarSource/sonarqube-quality-gate-action@v1
      #   if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   timeout-minutes: 5
      #   with:
      #     pollingTimeoutSec: 600
