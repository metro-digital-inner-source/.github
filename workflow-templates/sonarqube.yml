#
# SonarQube Static Code Analysis
#
# Minimal SonarQube workflow template for static code analysis.
# Customize as needed for your project requirements.
#
# Prerequisites:
# 1. Create a SonarQube project and obtain the {{ SONAR_PROJECT_KEY }}.
#    - if you onboard from SonarQube via GitHub integration, the project key will
#      be automatically generated in the format of {{GITHUB_ORG}}_{{REPO_NAME}}_{{UUID}}
#    - if you generate via local project creation, use at least {{GITHUB_ORG}}_{{REPO_NAME}}
#    - you can also update the key in SonarQube and remove the {{UUID}} suffix
# 2. In SonarQube Navigate and check the tutorials for GitHub Actions at
#    https://{{ SONAR_HOST_URL }}/tutorials?id={{ SONAR_PROJECT_KEY }}&selectedTutorial=github-actions
#    and follow the instructions that best fit your project, Do not overwrite this file,
#    instead, add extra steps as needed.
# 3. SONAR_HOST_URL is defined as organization-level variable and,
#    resolves to the prod enterprise SonarQube instance URL,
#    update if you are using a different SonarQube instance
# 4. There is an organization-level SONAR_TOKEN secret in GitHub, with scan access to all
#    SonarQube projects with the key pattern '^metro-digital-inner-source_.*'.
#    you can overwrite the token by adding a new token to the repository secrets
#
# Notes:
#   - For GitHub PR decoration, ensure DevOps Platform Integration is configured in SonarQube
#     and the project is linked to this GitHub repository.
#     Go to Project Settings > General Settings > DevOps Platform Integration
#     and make sure the required configuration values are set.
#   - If you do not want SonarQube to run on all PR events, use a label-based condition
#     (for example, only run when the PR has the `sonarqube-scan` label).
#     You can implement this by using the actions/labeler workflow.
#
# Contact:  Channel: SonarQube @ Deployment Tools in Microsoft Teams

name: SonarQube Scan

on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/**
      - .gitignore
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    # Skip SonarQube scans for Dependabot PRs as it does not have SONAR_TOKEN access.
    # If this workflow is required in branch protection settings,
    # Dependabot PRs can be blocked from merging by this check.
    # Move the condition to each step or use PR labels instead
    # to skip the job cleanly for Dependabot-originated PRs.
    if: github.actor != 'dependabot[bot]' && secrets.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
    name: SonarQube scan
    runs-on:
      - self-hosted
      - Linux
      - metro-network
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      # SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      SONAR_PROJECT_KEY: __REPLACE_WITH_SONAR_PROJECT_KEY__
      SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          # global SONAR_TOKEN for production SonarQube instance,
          # has access to all projects with key pattern
          # '^metro-digital-inner-source_.*'
          # update project key in SonarQube or
          # or overwrite with different token in github secrets if needed
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # We do not recommend to use this in a pull request. Prefer using pull request
      # decoration instead.
      # - uses: SonarSource/sonarqube-quality-gate-action@v1
      #   if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   timeout-minutes: 5
      #   with:
      #     pollingTimeoutSec: 600
