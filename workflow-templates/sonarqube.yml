#
# SonarQube Static Code Analysis
#
# Minimal SonarQube workflow template for static code analysis.
# Customize as needed for your project requirements.
#
## Prerequisites:
#
# 1. Create a SonarQube project and obtain the {{ SONAR_PROJECT_KEY }}.
#    - If onboarded via SonarQube GitHub integration, the project key is
#      automatically generated in the format:
#      {{GITHUB_ORG}}_{{REPO_NAME}}_{{UUID}}.
#    - If created locally, use at least:
#      {{GITHUB_ORG}}_{{REPO_NAME}}.
#    - You may update the key in SonarQube and remove the {{UUID}} suffix.
#
# 2. In SonarQube, navigate to the GitHub Actions tutorial:
#    {{SONAR_HOST_URL}}/tutorials?id={{SONAR_PROJECT_KEY}}&selectedTutorial=github-actions
#    Follow the instructions that best fit your project.
#    Do not overwrite this file — add extra steps as needed instead.
#
## Notes:
#
# 1. SONAR_HOST_URL is defined as an organization-level variable and
#    resolves to the production SonarQube instance.
#    Change it if you are using a different instance.
#
# 2. An organization-level SONAR_TOKEN secret exists in GitHub with
#    scan access to all SonarQube projects matching the pattern:
#    '^metro-digital-inner-source_.*'.
#    You can override it by adding a new token in repository secrets.
#
## Additional:
#
# - For GitHub PR decoration, ensure DevOps Platform Integration is
#   configured and the project is linked to this repository.
#   In SonarQube, go to:
#   Project Settings > General Settings > DevOps Platform Integration,
#   and verify all required values are set.
#
# - To limit execution on PR events, use a label-based condition
#   (e.g., run only when the PR has the `sonarqube-scan` label).
#   This can be implemented using the actions/labeler workflow.
#
# Contact:
#   Channel: SonarQube @ Deployment Tools (Microsoft Teams)

name: SonarQube Scan

on:
  push:
    branches:
      - $default-branch
    paths-ignore:
      - .github/**
      - .gitignore
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    # Skip SonarQube scans for Dependabot PRs, as they do not have
    # access to SONAR_TOKEN.
    #
    # If this workflow is required by branch protection rules,
    # Dependabot PRs may be blocked from merging due to this check.
    #
    # To avoid this, move the condition to individual steps or use
    # PR labels to skip the job cleanly for Dependabot PRs.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
    name: SonarQube scan
    runs-on:
      - self-hosted
      - Linux
      - metro-network
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      # SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      SONAR_PROJECT_KEY: __REPLACE_WITH_SONAR_PROJECT_KEY__
      SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@v7
        env:
          # global SONAR_TOKEN, read note 2 in the section above
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME }}

      # To fail the job when the Quality Gate is red, uncomment the
      # lines below. This is typically used to block deployments.
      #
      # This is not recommended for pull requests. Prefer using
      # pull request decoration instead.
      # - uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
      #   if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
      #   env:
      #     # global SONAR_TOKEN, read note 2 in the section above
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   timeout-minutes: 5
      #   with:
      #     pollingTimeoutSec: 600
